version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: petrol_partner_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: petrol_partner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petrol_partner_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
